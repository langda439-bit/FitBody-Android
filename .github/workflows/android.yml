name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # action 默认请求已被 Google 移除的 'tools' 包会导致失败，必须显式指定
          packages: 'platform-tools platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 仓库未提交 wrapper jar，CI 直接 provision 指定版本，不依赖 wrapper
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1
          code=$?
          echo "Gradle exit code: $code"
          # 将关键错误行以 error 注解输出，匿名可通过 check-runs API 读取
          grep -E "^e: |FAILED|FAILURE:|What went wrong|Caused by:|error:|Unresolved" build_log.txt | head -80 | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr '\r\n' '  ' | cut -c1-900)
            printf '::error::%s\n' "$clean"
          done
          # 额外输出错误上下文尾部，便于在注解之外排查
          tail -n 40 build_log.txt
          exit $code

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
